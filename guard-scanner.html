
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLMunTrack | Guard Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f8fafc;
        }

        main {
            max-width: 650px;
            margin: auto;
        }

        .panel {
            padding: 22px;
            margin-bottom: 18px;
            border: 1px solid #293851;
            border-radius: 16px;
            background: #111c31;
        }

        h1 { font-size: 25px; }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
        }

        button, input {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            border: 0;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        .secondary {
            background: #293851;
        }

        input {
            border: 1px solid #334155;
            background: #0b1425;
            color: white;
        }

        #message {
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        #result {
            display: none;
        }

        .result-row {
            padding: 12px 0;
            border-bottom: 1px solid #293851;
            overflow-wrap: anywhere;
        }

        .result-label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 12px;
        }

        .result-value {
            font-weight: bold;
        }

        a { color: #67e8f9; }
    </style>
</head>

<body>
<main>
    <section class="panel">
        <h1>🛡️ PLMunTrack Guard Scanner</h1>
        <p>
            Scan a student's QR code to process attendance.
            Check the returned result before allowing entry or exit.
        </p>
        <a href="dashboard.html">Back to Dashboard</a>
    </section>

    <section class="panel">
        <h2>Camera Scanner</h2>
        <div id="reader"></div>

        <button id="startButton" type="button">
            Start Camera
        </button>

        <button id="stopButton" class="secondary" type="button" disabled>
            Stop Camera
        </button>

        <p id="message" role="status" aria-live="polite">
            Ready to scan.
        </p>
    </section>

    <section class="panel">
        <h2>Manual QR Token</h2>

        <form id="tokenForm">
            <input
                id="tokenInput"
                type="text"
                placeholder="Enter QR token"
                autocomplete="off"
                required
            >

            <button id="submitButton" type="submit">
                Submit Token
            </button>
        </form>
    </section>

    <section class="panel" id="result">
        <h2>Scan Result</h2>

        <div class="result-row">
            <span class="result-label">Name</span>
            <span class="result-value" id="personName">—</span>
        </div>

        <div class="result-row">
            <span class="result-label">Student Number</span>
            <span class="result-value" id="personId">—</span>
        </div>

        <div class="result-row">
            <span class="result-label">Person Type</span>
            <span class="result-value" id="personType">—</span>
        </div>

        <div class="result-row">
            <span class="result-label">Date</span>
            <span class="result-value" id="scanDate">—</span>
        </div>

        <div class="result-row">
            <span class="result-label">Time</span>
            <span class="result-value" id="scanTime">—</span>
        </div>

        <div class="result-row">
            <span class="result-label">Status</span>
            <span class="result-value" id="attendanceStatus">—</span>
        </div>
    </section>
</main>

<script>
    const API_URL =
        "https://script.google.com/macros/s/AKfycbz2WDr8p9UzsvpGgrL_A3XRfmIt5P8yjmQiqiciuHqNZ1Gd72syFf21ytR3RVen6EEP/exec";

    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const submitButton = document.getElementById("submitButton");
    const tokenInput = document.getElementById("tokenInput");

    let scanner = null;
    let cameraRunning = false;
    let processing = false;

    function setMessage(text, color = "#cbd5e1") {
        message.textContent = text;
        message.style.color = color;
    }

    async function submitToken(rawToken) {
        const token = rawToken.trim();

        if (!token || processing) return;

        processing = true;
        submitButton.disabled = true;
        startButton.disabled = true;
        setMessage("Checking QR code...", "#67e8f9");

        try {
            const url = new URL(API_URL);
            url.searchParams.set("action", "scan");
            url.searchParams.set("token", token);

            const response = await fetch(url.toString());
            const data = await response.json();

            if (data.success !== true) {
                throw new Error(
                    data.message ||
                    data.error ||
                    "QR code is invalid or expired."
                );
            }

            showResult(data);

            setMessage(
                data.message || "QR code processed successfully.",
                "#86efac"
            );

            tokenInput.value = "";
        } catch (error) {
            console.error("Scan error:", error);

            setMessage(
                error.message || "Unable to process QR code.",
                "#fca5a5"
            );
        } finally {
            processing = false;
            submitButton.disabled = false;
            startButton.disabled = false;
        }
    }

    function showResult(data) {
        const person = data.person || data.student || data;
        const attendance = data.attendance || data;

        document.getElementById("personName").textContent =
            person.Full_Name || person.fullName || person.name || "—";

        document.getElementById("personId").textContent =
            person.Student_Number ||
            person.studentNumber ||
            person.student_number ||
            "—";

        document.getElementById("personType").textContent =
            person.Person_Type || person.personType || person.type || "—";

        document.getElementById("scanDate").textContent =
            attendance.Date || attendance.date || "—";

        document.getElementById("scanTime").textContent =
            attendance.Time ||
            attendance.time ||
            attendance.Time_In ||
            attendance.Time_Out ||
            "—";

        document.getElementById("attendanceStatus").textContent =
            attendance.Status ||
            attendance.status ||
            data.message ||
            "Processed";

        result.style.display = "block";
        result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function startCamera() {
        if (!window.Html5Qrcode) {
            setMessage(
                "Scanner library did not load. Check your internet connection.",
                "#fca5a5"
            );
            return;
        }

        if (cameraRunning) return;

        try {
            scanner = new Html5Qrcode("reader");

            await scanner.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 240, height: 240 }
                },
                async (decodedText) => {
                    if (processing) return;

                    await stopCamera();
                    await submitToken(decodedText);
                },
                () => {}
            );

            cameraRunning = true;
            startButton.disabled = true;
            stopButton.disabled = false;
            setMessage("Camera is running. Point it at a QR code.");
        } catch (error) {
            console.error("Camera error:", error);

            setMessage(
                "Cannot open camera. Allow camera access and open this page over HTTPS.",
                "#fca5a5"
            );

            if (scanner) {
                try { await scanner.clear(); } catch (_) {}
            }

            scanner = null;
            cameraRunning = false;
            startButton.disabled = false;
            stopButton.disabled = true;
        }
    }

    async function stopCamera() {
        if (scanner && cameraRunning) {
            try { await scanner.stop(); } catch (_) {}
            try { await scanner.clear(); } catch (_) {}
        }

        scanner = null;
        cameraRunning = false;
        startButton.disabled = false;
        stopButton.disabled = true;
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);

    document.getElementById("tokenForm").addEventListener(
        "submit",
        async (event) => {
            event.preventDefault();
            await submitToken(tokenInput.value);
        }
    );

    window.addEventListener("pagehide", () => {
        if (scanner && cameraRunning) {
            scanner.stop().catch(() => {});
        }
    });
</script>
</body>
</html>
