
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLMunTrack | Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      font-family: Arial, sans-serif; color: #f8fafc; background: #0b1120;
    }
    .login-card {
      width: 100%; max-width: 410px; padding: 32px;
      border: 1px solid #293851; border-radius: 20px;
      background: #111c31; box-shadow: 0 20px 50px #0004;
    }
    .logo {
      width: 58px; height: 58px; display: grid; place-items: center;
      margin: 0 auto 18px; border-radius: 16px;
      background: #3730a3; font-size: 25px; font-weight: bold;
    }
    h1 { margin: 0; text-align: center; font-size: 27px; }
    .subtitle { margin: 10px 0 28px; color: #94a3b8; text-align: center; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 16px 0 8px; font-size: 14px; color: #cbd5e1; }
    input {
      width: 100%; padding: 13px; border: 1px solid #334155;
      border-radius: 10px; background: #0b1425; color: white; font-size: 15px;
    }
    button {
      width: 100%; margin-top: 23px; padding: 14px; border: 0;
      border-radius: 10px; background: #6366f1; color: white;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .register-link { margin-top: 22px; color: #94a3b8; text-align: center; font-size: 14px; }
    a { color: #67e8f9; text-decoration: none; }
    #message { margin-top: 18px; font-size: 13px; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">P</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your PLMunTrack account</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" autocomplete="username"
             placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password"
             placeholder="Enter your password" required>

      <button type="submit" id="loginButton">Log In</button>
    </form>

    <p class="register-link">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKAPZZdsY6mkkcCT8LSFpHAYMy3TEDRog",
      authDomain: "plmuntrack.firebaseapp.com",
      projectId: "plmuntrack",
      storageBucket: "plmuntrack.firebasestorage.app",
      messagingSenderId: "156534335192",
      appId: "1:156534335192:web:35d43ff8446786840919ad"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.style.color = "#cbd5e1";
      message.textContent = "Signing in...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        await signInWithEmailAndPassword(auth, email, password);
        message.style.color = "#86efac";
        message.textContent = "Login successful. Opening dashboard...";
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error("Firebase sign-in error:", error.code);
        message.style.color = "#fca5a5";

        if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found"].includes(error.code)) {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent = "Too many attempts. Please try again later.";
        } else {
          message.textContent = "Login failed. Check your internet connection and Firebase settings.";
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
