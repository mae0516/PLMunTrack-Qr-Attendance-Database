
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz2WDr8p9UzsvpGgrL_A3XRfmIt5P8yjmQiqiciuHqNZ1Gd72syFf21ytR3RVen6EEP/exec";

let visitors = [];
let visitorChart = null;

document.getElementById("currentDate").textContent =
  new Intl.DateTimeFormat("en-PH", {
    year: "numeric",
    month: "short",
    day: "numeric"
  }).format(new Date());

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function toggleSecret() {
  const input = document.getElementById("adminSecret");
  input.type = input.type === "password" ? "text" : "password";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function animateNumber(id, target) {
  const element = document.getElementById(id);
  if (!element) return;

  const end = Number(target) || 0;
  const start = Number(element.dataset.current || 0);
  const duration = 500;
  const startTime = performance.now();

  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);

    element.textContent = Math.round(
      start + (end - start) * eased
    );

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      element.dataset.current = String(end);
    }
  }

  requestAnimationFrame(step);
}

async function getJSON(url) {
  const response = await fetch(url, { cache: "no-store" });

  if (!response.ok) {
    throw new Error("HTTP error: " + response.status);
  }

  const data = await response.json();

  if (!data || typeof data !== "object") {
    throw new Error("Invalid response from Apps Script.");
  }

  if (data.success === false) {
    throw new Error(data.message || "Apps Script request failed.");
  }

  return data;
}

function countStatus(status) {
  return visitors.filter(visitor =>
    String(visitor.authorizationStatus || visitor.Authorization_Status || "")
      .trim().toLowerCase() === status.toLowerCase()
  ).length;
}

async function refreshDashboard() {
  const message = document.getElementById("dashboardMessage");

  try {
    const data = await getJSON(
      API_URL + "?action=dashboard&t=" + Date.now()
    );

    animateNumber("totalVisitors", data.totalVisitors ?? visitors.length);
    animateNumber("pendingVisitors", data.pendingVisitors ?? countStatus("Pending"));
    animateNumber("authorizedVisitors", data.authorizedVisitors ?? countStatus("Authorized"));
    animateNumber("revokedVisitors", data.revokedVisitors ?? countStatus("Revoked"));

    updateChart(
      Number(data.pendingVisitors ?? countStatus("Pending")),
      Number(data.authorizedVisitors ?? countStatus("Authorized")),
      Number(data.revokedVisitors ?? countStatus("Revoked"))
    );

    document.getElementById("connectionStatus").textContent =
      "Database connected";

    if (message) message.textContent = "Dashboard updated successfully.";

  } catch (error) {
    console.error("Dashboard error:", error);

    document.getElementById("connectionStatus").textContent =
      "Dashboard connection error";

    if (message) {
      message.textContent = "Dashboard could not refresh: " + error.message;
    }

    updateChart(
      countStatus("Pending"),
      countStatus("Authorized"),
      countStatus("Revoked")
    );
  }
}

function updateChart(pending, authorized, revoked) {
  const canvas = document.getElementById("visitorChart");
  const message = document.getElementById("analyticsMessage");

  if (!canvas || typeof Chart === "undefined") {
    if (message) {
      message.textContent = "Chart library unavailable. Visitor records can still be viewed.";
    }
    return;
  }

  if (message) message.textContent = "";

  if (visitorChart) {
    visitorChart.data.datasets[0].data = [
      pending, authorized, revoked
    ];
    visitorChart.update();
    return;
  }

  visitorChart = new Chart(canvas, {
    type: "doughnut",
    data: {
      labels: ["Pending", "Authorized", "Revoked"],
      datasets: [{
        data: [pending, authorized, revoked],
        backgroundColor: ["#fbbf24", "#34d399", "#fb7185"],
        borderColor: "#111a2e",
        borderWidth: 5,
        hoverOffset: 9
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "70%",
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: "#aab8cf",
            padding: 18,
            usePointStyle: true,
            pointStyle: "circle",
            font: { family: "Inter", size: 11 }
          }
        }
      }
    }
  });
}

async function loadVisitors() {
  const tbody = document.getElementById("visitorTable");
  const count = document.getElementById("recordCount");

  if (!tbody) {
    console.error("Missing HTML element: visitorTable");
    return;
  }

  tbody.innerHTML =
    '<tr><td colspan="6">Loading visitor records...</td></tr>';

  if (count) count.textContent = "LOADING...";

  try {
    const data = await getJSON(
      API_URL + "?action=visitors&t=" + Date.now()
    );

    // Apps Script returns { success: true, visitors: [...] }.
    const records = Array.isArray(data)
      ? data
      : Array.isArray(data.visitors)
        ? data.visitors
        : Array.isArray(data.records)
          ? data.records
          : null;

    if (!records) {
      throw new Error("The response does not contain a visitor list.");
    }

    visitors = records;

    console.log("Visitor records loaded:", visitors.length);

    renderVisitors();
    await refreshDashboard();

  } catch (error) {
    console.error("Visitor loading error:", error);

    visitors = [];
    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="text-align:center;padding:20px;">
          Unable to load visitor records. ${escapeHTML(error.message)}
        </td>
      </tr>
    `;

    if (count) count.textContent = "LOAD ERROR";

    document.getElementById("connectionStatus").textContent =
      "Visitor loading error";
  }
}

function renderVisitors() {
  const tbody = document.getElementById("visitorTable");
  const searchInput = document.getElementById("visitorSearch");
  const count = document.getElementById("recordCount");

  if (!tbody || !searchInput) {
    console.error("Visitor table or search input is missing.");
    return;
  }

  const query = searchInput.value.trim().toLowerCase();

  const filtered = visitors.filter(visitor => {
    const name = String(visitor.fullName || visitor.Full_Name || "");
    const id = String(visitor.visitorId || visitor.Visitor_ID || "");

    return name.toLowerCase().includes(query) ||
           id.toLowerCase().includes(query);
  });

  if (count) {
    count.textContent =
      filtered.length + (filtered.length === 1 ? " RECORD" : " RECORDS");
  }

  if (filtered.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="text-align:center;padding:20px;">
          ${visitors.length === 0
            ? "No visitor records were returned by the database."
            : "No matching visitor records."}
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = filtered.map(visitor => {
    const id = String(visitor.visitorId || visitor.Visitor_ID || "");
    const name = String(visitor.fullName || visitor.Full_Name || "");
    const purpose = String(visitor.purpose || visitor.Purpose || "");
    const date = String(visitor.visitDate || visitor.Visit_Date || "");
    const auth = String(
      visitor.authorizationStatus ||
      visitor.Authorization_Status ||
      "Pending"
    );

    const normalized = auth.trim().toLowerCase();

    let badgeClass = "badge-pending";
    if (normalized === "authorized") badgeClass = "badge-authorized";
    if (normalized === "revoked") badgeClass = "badge-revoked";

    let action = '<span style="color:#64748b">No action</span>';

    if (normalized === "pending" || normalized === "revoked") {
      action = `
        <button class="action-btn"
          data-id="${escapeHTML(id)}"
          onclick="updateAuthorization(this.dataset.id,'Authorized',this)">
          ✓ Authorize
        </button>`;
    } else if (normalized === "authorized") {
      action = `
        <button class="action-btn revoke"
          data-id="${escapeHTML(id)}"
          onclick="updateAuthorization(this.dataset.id,'Revoked',this)">
          ⊘ Revoke
        </button>`;
    }

    return `
      <tr>
        <td class="name-cell">${escapeHTML(name)}</td>
        <td class="id-cell">${escapeHTML(id)}</td>
        <td>${escapeHTML(purpose)}</td>
        <td>${escapeHTML(date || "—")}</td>
        <td>
          <span class="badge ${badgeClass}">
            ${escapeHTML(auth)}
          </span>
        </td>
        <td>${action}</td>
      </tr>
    `;
  }).join("");
}

async function updateAuthorization(visitorId, authorizationStatus, button) {
  const secretInput = document.getElementById("adminSecret");
  const message = document.getElementById("authorizationMessage");
  const secret = secretInput.value;

  if (!secret.trim()) {
    message.textContent =
      "Enter your admin secret before continuing.";
    secretInput.focus();
    return;
  }

  if (!confirm(
    "Set visitor " + visitorId + " to " + authorizationStatus + "?"
  )) {
    return;
  }

  if (button) button.disabled = true;
  message.textContent = "Submitting request...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify({
        action: "authorizeVisitor",
        visitorId: visitorId,
        authorizationStatus: authorizationStatus,
        adminSecret: secret
      })
    });

    const result = await response.json();

    if (!response.ok || result.success !== true) {
      throw new Error(result.message || "Authorization was not confirmed.");
    }

    message.textContent = result.message || "Authorization updated.";
    secretInput.value = "";

    await loadVisitors();

  } catch (error) {
    console.error("Authorization error:", error);

    message.textContent =
      "Could not confirm the request. " + error.message +
      " Reload the records before trying again.";

  } finally {
    if (button) button.disabled = false;
  }
}

function refreshAll() {
  loadVisitors();
}

loadVisitors();
</script>
