
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLMunTrack | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: #0b1120;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 32px;
            border: 1px solid #293851;
            border-radius: 20px;
            background: #111c31;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #3730a3;
            color: #ffffff;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            margin: 10px 0 28px;
            color: #94a3b8;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0b1425;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #6366f1;
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 23px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .register-link {
            margin-top: 22px;
            color: #94a3b8;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #67e8f9;
            text-decoration: none;
        }

        .notice {
            margin-top: 18px;
            color: #fbbf24;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">P</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">
            Sign in to your PLMunTrack account
        </p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <p class="notice">
            Authentication is not connected yet. Do not enter a real password
            on this prototype page.
        </p>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                alert(
                    "The login interface is ready, but secure authentication " +
                    "has not been connected yet."
                );
            }
        );
    </script>
</body>
</html>
