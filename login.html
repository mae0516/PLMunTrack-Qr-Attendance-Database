
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLMunTrack | Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #312e81);
      padding: 20px;
      color: #fff;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      padding: 32px;
      border: 1px solid #374151;
      border-radius: 18px;
      background: #1f2937;
      box-shadow: 0 20px 50px #0005;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #4f46e5;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #4b5563;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      outline: none;
    }

    input:focus {
      border-color: #818cf8;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">P</div>

    <h1>PLMunTrack</h1>
    <p class="subtitle">Administrator Login</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Enter admin username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Sign In</button>
      <p id="message" role="status"></p>
    </form>

    <p class="footer">
      PLMunTrack Attendance Management System
    </p>
  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyLVFOpie6VJ6Q2qhUj9DqmFHMj1MLH3iFEDMG70QlgeTHQ0jcNTzv0pP2f4mcgM0IcyA/exec";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      try {
        const body = new URLSearchParams({
          action: "loginAdmin",
          username: username,
          password: password
        });

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: body
        });

        const result = await response.json();

        if (!result.success || !result.token) {
          throw new Error(result.message || "Login failed.");
        }

        sessionStorage.setItem(
          "plmuntrackAdminToken",
          result.token
        );

        sessionStorage.setItem(
          "plmuntrackAdminName",
          result.fullName || "Administrator"
        );

        message.style.color = "#86efac";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

      } catch (error) {
        message.style.color = "#fca5a5";
        message.textContent =
          error.message ||
          "Unable to connect. Check the Apps Script deployment.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
