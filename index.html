<style>
:root {
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-light: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #2563eb;
  --cyan: #0891b2;
  --green: #16a34a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

.ambient {
  position: fixed;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  filter: blur(110px);
  opacity: .08;
  pointer-events: none;
  z-index: -1;
}

.ambient.one {
  top: -150px;
  left: -120px;
  background: #60a5fa;
}

.ambient.two {
  top: 250px;
  right: -180px;
  background: #67e8f9;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 16px 6%;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(15,23,42,.03);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  font-weight: 800;
  flex-shrink: 0;
}

.brand-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg,#2563eb,#0891b2);
  color: white;
}

.brand small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 7px;
}

.nav a {
  padding: 10px 12px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  transition: .2s;
}

.nav a:hover {
  background: #eff6ff;
  color: #1d4ed8;
}

.nav .register-link {
  color: white;
  background: #0284c7;
}

.nav .admin-link {
  color: white;
  background: #2563eb;
}

.container {
  width: min(1120px,88%);
  margin: auto;
}

.hero {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  align-items: center;
  gap: 50px;
  padding: 78px 0 70px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 13px;
  border: 1px solid #bfdbfe;
  border-radius: 50px;
  background: #eff6ff;
  color: #1d4ed8;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;
}

.eyebrow i {
  color: var(--cyan);
}

.hero h1 {
  margin: 23px 0 18px;
  font-size: clamp(38px,5.3vw,62px);
  line-height: 1.08;
  letter-spacing: -2px;
  font-weight: 800;
}

.gradient-text {
  background: linear-gradient(100deg,#2563eb,#0891b2);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 540px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 13px 17px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  transition: transform .2s, box-shadow .2s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(15,23,42,.10);
}

.btn-primary {
  color: white;
  background: #2563eb;
}

.btn-secondary {
  color: #1e293b;
  background: white;
  border-color: #cbd5e1;
}

.btn-register {
  color: white;
  background: #0284c7;
}

.hero-visual {
  padding: 27px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: linear-gradient(145deg,#ffffff,#f1f5f9);
  box-shadow: 0 20px 55px rgba(15,23,42,.07);
}

.visual-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 25px;
}

.visual-top h3 {
  font-size: 14px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #15803d;
  font-size: 10px;
  font-weight: 700;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.qr-frame {
  display: grid;
  place-items: center;
  width: 165px;
  height: 165px;
  margin: 0 auto 22px;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  background: #ffffff;
  color: #0f172a;
}

.qr-frame i {
  font-size: 105px;
}

.visual-caption {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
}

.visual-subcaption {
  margin-top: 7px;
  color: var(--muted);
  text-align: center;
  font-size: 11px;
}

.mini-stats {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
  margin-top: 24px;
}

.mini-stat {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #f8fafc;
}

.mini-stat-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #dbeafe;
  color: #2563eb;
  flex-shrink: 0;
}

.mini-stat strong {
  display: block;
  font-size: 11px;
}

.mini-stat span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
}

section {
  scroll-margin-top: 90px;
}

.tools-section {
  padding: 15px 0 75px;
}

.section-heading {
  margin-bottom: 27px;
}

.overline {
  margin-bottom: 10px;
  color: #2563eb;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.section-heading h2 {
  font-size: clamp(23px,3vw,32px);
  letter-spacing: -.8px;
}

.section-heading p {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 18px;
}

.tool-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 230px;
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #ffffff;
  box-shadow: 0 3px 12px rgba(15,23,42,.025);
  transition: transform .25s,border-color .25s,box-shadow .25s;
}

.tool-card:hover {
  transform: translateY(-5px);
  border-color: #93c5fd;
  box-shadow: 0 14px 30px rgba(15,23,42,.08);
}

.tool-icon {
  display: grid;
  place-items: center;
  width: 47px;
  height: 47px;
  margin-bottom: 19px;
  border-radius: 13px;
  background: #eff6ff;
  color: #2563eb;
  font-size: 18px;
}

.tool-card h3 {
  margin-bottom: 10px;
  font-size: 15px;
}

.tool-card p {
  margin-bottom: 20px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.tool-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  color: #2563eb;
  font-size: 11px;
  font-weight: 800;
}

.workflow {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
  padding-bottom: 75px;
}

.workflow-item {
  padding: 20px 17px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #ffffff;
  box-shadow: 0 3px 12px rgba(15,23,42,.025);
}

.step-number {
  margin-bottom: 14px;
  color: #2563eb;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
}

.workflow-item h4 {
  margin-bottom: 8px;
  font-size: 13px;
}

.workflow-item p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.notice {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  margin-bottom: 60px;
  padding: 19px;
  border: 1px solid #bae6fd;
  border-radius: 14px;
  background: #f0f9ff;
}

.notice i {
  margin-top: 2px;
  color: #0284c7;
}

.notice strong {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
}

.notice p {
  color: #475569;
  font-size: 11px;
  line-height: 1.8;
}

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 25px 6%;
  border-top: 1px solid var(--border);
  background: #ffffff;
  color: var(--muted);
  font-size: 10px;
}

footer strong {
  color: #0f172a;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 17px;
}

.footer-links a:hover {
  color: #2563eb;
}

@media (max-width: 1050px) {
  .tools-grid {
    grid-template-columns: repeat(2,1fr);
  }

  .topbar {
    padding-left: 4%;
    padding-right: 4%;
  }
}

@media (max-width: 850px) {
  .nav {
    gap: 2px;
  }

  .nav a {
    padding: 9px;
  }

  .hero {
    gap: 30px;
    padding-top: 55px;
  }

  .workflow {
    grid-template-columns: repeat(2,1fr);
  }
}

@media (max-width: 600px) {
  .topbar {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .nav {
    width: 100%;
    justify-content: flex-start;
    overflow-x: auto;
    flex-wrap: nowrap;
  }

  .nav a {
    white-space: nowrap;
  }

  .hero {
    grid-template-columns: 1fr;
    padding: 45px 0 55px;
  }

  .hero h1 {
    letter-spacing: -1px;
  }

  .hero-visual {
    max-width: 420px;
    width: 100%;
    margin: auto;
  }

  .tools-grid {
    grid-template-columns: 1fr;
  }

  .tool-card {
    min-height: 195px;
  }

  .workflow {
    grid-template-columns: 1fr 1fr;
  }

  footer {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
