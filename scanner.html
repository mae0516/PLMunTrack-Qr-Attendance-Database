
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLMunTrack - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 22px;
      background: #1e293b;
      border-radius: 16px;
    }

    h1 { text-align: center; color: #818cf8; }
    p { text-align: center; color: #cbd5e1; }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #334155;
      overflow-wrap: anywhere;
    }

    .success { color: #86efac; }
    .error { color: #fca5a5; }
    a { color: #67e8f9; }
  </style>
</head>

<body>
  <div class="container">
    <h1>PLMunTrack</h1>
    <p>QR Code Attendance Scanner</p>

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()">
      Start Camera Scanner
    </button>

    <button id="stopBtn" onclick="stopScanner()" disabled>
      Stop Camera
    </button>

    <div id="result" role="status" aria-live="polite">
      Pindutin ang Start Camera Scanner para magsimula.
    </div>

    <p><a href="index.html">Back to Home</a></p>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz2WDr8p9UzsvpGgrL_A3XRfmIt5P8yjmQiqiciuHqNZ1Gd72syFf21ytR3RVen6EEP/exec";

    let scanner = null;
    let processing = false;

    function showMessage(message, type = "") {
      const result = document.getElementById("result");
      result.className = type;
      result.textContent = message;
    }

    async function startScanner() {
      if (scanner) return;

      if (!window.Html5Qrcode) {
        showMessage("Hindi ma-load ang QR scanner library. Check your internet connection.", "error");
        return;
      }

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 240, height: 240 } },
          handleQRCode,
          () => {}
        );

        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
        showMessage("Camera active. Itapat ang camera sa PLMunTrack QR code.");
      } catch (error) {
        scanner = null;
        showMessage(
          "Hindi mabuksan ang camera. Gamitin ang HTTPS website sa cellphone at payagan ang camera permission.",
          "error"
        );
      }
    }

    async function stopScanner() {
      if (!scanner) return;

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (error) {
        console.log(error);
      }

      scanner = null;
      processing = false;
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
      showMessage("Camera stopped.");
    }

    async function handleQRCode(decodedText) {
      if (processing) return;
      processing = true;

      showMessage("QR detected. Checking attendance...");

      try {
        const url = API_URL + "?action=scan&token=" +
          encodeURIComponent(decodedText);

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(data.message || "Hindi na-validate ang QR code.", "error");
          return;
        }

        const details = [
          "Result: " + (data.message || "Attendance processed"),
          data.fullName ? "Name: " + data.fullName : "",
          data.studentNumber ? "Student Number: " + data.studentNumber : "",
          data.personType ? "Type: " + data.personType : "",
          data.date ? "Date: " + data.date : "",
          data.time ? "Time: " + data.time : "",
          data.status ? "Status: " + data.status : ""
        ].filter(Boolean);

        showMessage(details.join("\n"), "success");
      } catch (error) {
        showMessage(
          "Hindi makakonekta sa attendance server. Check internet at Apps Script deployment.",
          "error"
        );
      } finally {
        setTimeout(() => { processing = false; }, 2000);
      }
    }
  </script>
</body>
</html>
