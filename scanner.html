
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLMunTrack - QR Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background: #1e293b;
      border-radius: 16px;
    }

    h1, h2 { text-align: center; }
    h1 { color: #818cf8; }
    .hint { color: #cbd5e1; line-height: 1.6; }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      padding: 16px;
      background: #0f172a;
      border-radius: 10px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .success { color: #4ade80; }
    .error { color: #fca5a5; }
    .label { color: #cbd5e1; }
  </style>
</head>

<body>
  <main class="container">
    <h1>PLMunTrack</h1>
    <h2>QR Attendance Scanner</h2>

    <p class="hint">
      I-scan ang iyong valid QR code para sa attendance.
      Ipapakita rito ang resulta ng scan.
    </p>

    <div id="reader"></div>
    <button id="startBtn" type="button">Start Scanner</button>

    <div id="result" aria-live="polite">
      Handa nang mag-scan.
    </div>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz2WDr8p9UzsvpGgrL_A3XRfmIt5P8yjmQiqiciuHqNZ1Gd72syFf21ytR3RVen6EEP/exec";

    const resultBox = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");

    let scanner = null;
    let processing = false;
    let scannerRunning = false;

    function showMessage(message, type = "") {
      resultBox.className = type;
      resultBox.textContent = message;
    }

    function showAttendance(data) {
      resultBox.className = "success";
      resultBox.replaceChildren();

      const heading = document.createElement("h3");
      heading.textContent = data.status || "SCAN SUCCESSFUL";
      resultBox.appendChild(heading);

      const fields = [
        ["Name", data.fullName || data.name],
        ["ID", data.studentNumber || data.visitorId],
        ["Type", data.personType || data.type],
        ["Date", data.date || data.visitDate],
        ["Time", data.time],
        ["Attendance", data.status],
        ["Message", data.message]
      ];

      fields.forEach(([label, value]) => {
        if (value !== undefined && value !== null && value !== "") {
          const line = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = label + ": ";
          line.append(strong, document.createTextNode(String(value)));
          resultBox.appendChild(line);
        }
      });
    }

    async function verifyQR(qrText) {
      if (processing) return;
      processing = true;

      showMessage("QR detected. Checking registration and recording attendance...");

      try {
        const url = API_URL + "?action=scan&token=" +
          encodeURIComponent(qrText);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Server returned HTTP " + response.status);
        }

        const data = await response.json();

        if (data.success) {
          showAttendance(data);
        } else {
          showMessage(
            data.message || "QR verification failed.",
            "error"
          );
        }
      } catch (error) {
        showMessage(
          "Hindi makakonekta sa server. I-check ang Apps Script deployment at scan action. " +
          error.message,
          "error"
        );
      } finally {
        processing = false;
        startBtn.textContent = "Scan Again";
        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener("click", async () => {
      if (scannerRunning) return;

      if (typeof Html5Qrcode === "undefined") {
        showMessage("Hindi ma-load ang QR scanner library. Check your internet connection.", "error");
        return;
      }

      startBtn.disabled = true;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras.length) {
          throw new Error("Walang camera na nakita.");
        }

        const camera = cameras[0];

        await scanner.start(
          camera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (decodedText) => {
            if (processing) return;

            try {
              await scanner.stop();
              scannerRunning = false;
              await verifyQR(decodedText);
            } catch (error) {
              scannerRunning = false;
              showMessage("Hindi maihinto ang scanner nang maayos.", "error");
            }
          },
          () => {}
        );

        scannerRunning = true;
        showMessage("Camera is on. Itapat ang QR code sa scan box.");
        startBtn.textContent = "Scanner Running";
        startBtn.disabled = false;

      } catch (error) {
        scannerRunning = false;
        showMessage(
          "Hindi mabuksan ang camera. Payagan ang camera access at subukan muli.",
          "error"
        );
        startBtn.textContent = "Start Scanner";
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
